<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Planning pour cours et examens</title>
	<!-- Lien vers Bootstrap CSS -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css">
    <!-- lien vers fuul calender js  -->
    <link href='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css' rel='stylesheet' />
  <link href='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.print.min.css' rel='stylesheet' media='print' />
  <script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.24.0/moment.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js'></script>
  <!-- link css -->
  <link rel="stylesheet" href="planing.css">
  <!-- fontasesome CDN Link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
 
</head>
<body>
     <!-- Barre de navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Calendrier de réservation de cours de conduite</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item active">
            <a class="nav-link" href="#">Accueil <span class="sr-only">(current)</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">plannifier</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h1>Réservation de cours de conduite</h1>
        <br>
        <button class="btn btn-success" data-toggle="modal" data-target="#reservationModal"><i class="fas fa-plus"></i> Nouvelle séance</button>
        <br><br>
        <div id="calendar"></div>
      </div>
    </div>
  </div>

    <div id="reservationModal" class="modal fade">
        <div class="modal-dialog">
          <div class="modal-content">
            <form id="addReservationForm">
              <div class="modal-header">
                <h4 class="modal-title">Ajouter une séance</h4>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
              </div>
              <div class="modal-body">
                <div class="form-group">
                  <label for="title">Titre</label>
                  <input type="text" class="form-control" id="addTitle" name="title" required>
                </div>
                <div class="form-group">
                  <label for="start">Début</label>
                  <input type="text" class="form-control datetimepicker" id="addStart" name="start" required>
                </div>
                <div class="form-group">
                  <label for="end">Fin</label>
                  <input type="text" class="form-control datetimepicker" id="addEnd" name="end" required>
                </div>
                <div class="form-group">
                  <label for="instructor">Instructeur</label>
                  <select class="form-control" id="addInstructor" name="instructor" required>
                    <option value=""></option>
                    <option value="John">John</option>
                    <option value="Jane">Jane</option>
                  </select>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Annuler</button>
                <button type="submit" class="btn btn-success" id="addSubmitButton">Enregistrer</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      
	<script src="planing.js"></script>
	<!-- Lien vers les scripts JavaScript de Bootstrap -->
	<script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.21.0/moment.min.js'></script>
  <script src='https://code.jquery.com/jquery-3.2.1.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js'></script>
  <script src='https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.9.0/fullcalendar.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.7.1/js/bootstrap-datepicker.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.18.1/locale/fr.js'></script>
</body>
</html>
